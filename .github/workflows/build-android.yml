name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare webDir (www)
        run: |
          mkdir -p www
          rsync -a --exclude node_modules --exclude android --exclude .git --exclude www \
            --exclude .github ./ www/
          # Capacitor needs relative asset paths (already relative)

      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyvex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
