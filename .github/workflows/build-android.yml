name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare webDir (www)
        run: |
          mkdir -p www
          rsync -a --exclude node_modules --exclude android --exclude .git --exclude www \
            --exclude .github ./ www/
          # APK must open chat, not marketing landing
          cat > www/index.html << 'INNER'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="theme-color" content="#0a0a0f">
            <title>NYVEX</title>
            <script>
              try { localStorage.setItem('nyvex_landing_seen', '1'); } catch (e) {}
              location.replace('./app.html');
            </script>
            <meta http-equiv="refresh" content="0;url=./app.html">
          </head>
          <body style="background:#0a0a0f;color:#ececf1;font-family:system-ui;padding:24px;text-align:center;">
            <p>Открываем NYVEX…</p>
            <p><a href="./app.html" style="color:#00d9ff;">Перейти в чат</a></p>
          </body>
          </html>
          INNER

      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyvex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Copy APK to downloads path (artifact only)
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/nyvex.apk || true
