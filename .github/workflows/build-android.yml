name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare webDir
        run: |
          mkdir -p www
          rsync -a --exclude node_modules --exclude android --exclude .git --exclude www --exclude .github --exclude downloads --exclude '*.apk' ./ www/
          cp www/app.html www/index.html
          echo "webDir ready"

      - name: Init Capacitor
      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply icons
      - name: Apply icons and version
        run: |
          pip install pillow -q
          python3 scripts/apply-android-icons.py

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 missing. See docs/RUSTORE-RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/nyvex-release.keystore"
          test -s "$GITHUB_WORKSPACE/nyvex-release.keystore"

      - name: Configure release signing
        run: python3 scripts/configure-release-signing.py

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Need KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi
          cd android
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -lah "$APK"
          test -n "$APK" && test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/nyvex-release.apk"
          SIZE=$(stat -c%s "$GITHUB_WORKSPACE/nyvex-release.apk")
          echo "APK bytes=$SIZE"
          jarsigner -verify -verbose -certs "$GITHUB_WORKSPACE/nyvex-release.apk" | tee /tmp/verify.txt
          grep -qi "jar verified" /tmp/verify.txt
          if grep -qi "CN=Android Debug" /tmp/verify.txt; then
            echo "::error::Android Debug signature"
            exit 1
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyvex-release-apk
          path: nyvex-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: NYVEX Android ${{ github.run_number }}
          body: |
            NYVEX Android — models download on first launch (~350 МБ for Fast).

            - No model packed inside APK (smaller install)
            - First run: agreement → download AI over Wi‑Fi
            - Switch models in Settings

            Wi‑Fi recommended for first launch.
          files: nyvex-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/nyvex-release.keystore" || true
