name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare webDir (www) — chat only, no landing
        run: |
          mkdir -p www
          rsync -a --exclude node_modules --exclude android --exclude .git --exclude www \
            --exclude .github --exclude downloads ./ www/
          cp www/app.html www/index.html
          python3 -c "from pathlib import Path; p=Path('www/index.html'); t=p.read_text();\n\
p.write_text(t if 'nyvex-native-v2' in t else t.replace('<head>', '<head>\\n  <!-- nyvex-native-v2 -->', 1))"

      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply launcher icons + version
        run: |
          pip install pillow -q
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import re
          im = Image.open("assets/icons/icon-512.png").convert("RGBA")
          densities = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          res = Path("android/app/src/main/res")
          for folder, size in densities.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              icon = im.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"):
                  icon.save(d / name)
          gradle = Path("android/app/build.gradle")
          if gradle.exists():
              t = gradle.read_text()
              t = re.sub(r"versionCode\s+\d+", "versionCode 21", t)
              t = re.sub(r'versionName\s+"[^"]*"', 'versionName "2.0.1"', t)
              gradle.write_text(t)
          print("icons + version 2.0.1")
          PY

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See docs/RUSTORE-RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/nyvex-release.keystore"
          test -s "$GITHUB_WORKSPACE/nyvex-release.keystore"
          ls -la "$GITHUB_WORKSPACE/nyvex-release.keystore"

      - name: Configure release signing in build.gradle
        run: python3 scripts/configure-release-signing.py

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Need KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secrets"
            exit 1
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and verify release APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -laR android/app/build/outputs/apk || true
          test -n "$APK" && test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/nyvex-release.apk"
          jarsigner -verify -verbose -certs "$GITHUB_WORKSPACE/nyvex-release.apk" | tee /tmp/verify.txt
          grep -qi "jar verified" /tmp/verify.txt
          if grep -qi "CN=Android Debug" /tmp/verify.txt; then
            echo "::error::Signed with Android Debug — rejected"
            exit 1
          fi
          echo "Release signature OK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyvex-release-apk
          path: nyvex-release.apk
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/nyvex-release.keystore" || true
